```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WILDARCH</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0d1710;
            --bg2: #111f14;
            --green: #78a95a;
            --green-light: #9bc477;
            --text: #eef2e8;
            --muted: #899589;
            --border: #263629;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* NAV */

        nav {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--green-light);
        }

        nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            color: white;
        }

        /* HERO */

        .hero {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
            position: relative;
            overflow: hidden;
        }

        /* pequeños bloques decorativos */

        .block {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #29442b;
            opacity: .6;
        }

        .block1 {
            top: 22%;
            left: 12%;
        }

        .block2 {
            top: 35%;
            right: 15%;
        }

        .block3 {
            bottom: 25%;
            left: 20%;
        }

        .block4 {
            bottom: 18%;
            right: 24%;
        }

        .hero-content {
            max-width: 700px;
        }

        .tag {
            display: inline-block;
            margin-bottom: 25px;
            color: var(--green-light);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(60px, 11vw, 125px);
            letter-spacing: 8px;
            line-height: .9;
            font-weight: 900;
            color: #8fba70;
        }

        .subtitle {
            margin-top: 22px;
            color: var(--muted);
            font-size: 17px;
        }

        /* IP */

        .server {
            display: inline-flex;
            align-items: center;
            margin-top: 35px;
            border: 1px solid var(--border);
            background: var(--bg2);
        }

        .ip {
            padding: 15px 20px;
            font-family: monospace;
            color: var(--green-light);
        }

        button {
            border: none;
            border-left: 1px solid var(--border);
            padding: 15px 18px;
            background: var(--green);
            color: #101910;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: var(--green-light);
        }

        /* DISCORD */

        .discord {
            display: inline-block;
            margin-top: 18px;
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
        }

        .discord:hover {
            color: white;
        }

        /* FEATURES */

        .features {
            border-top: 1px solid var(--border);
            background: var(--bg2);
            padding: 70px 7%;
        }

        .features-grid {
            max-width: 850px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }

        .feature {
            padding: 25px;
            border-right: 1px solid var(--border);
            text-align: center;
        }

        .feature:last-child {
            border-right: none;
        }

        .feature h3 {
            font-size: 14px;
            margin-bottom: 9px;
            color: var(--green-light);
            letter-spacing: 1px;
        }

        .feature p {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        /* FOOTER */

        footer {
            padding: 25px;
            text-align: center;
            color: #536053;
            font-size: 12px;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            nav {
                padding: 0 20px;
            }

            nav a {
                display: none;
            }

            h1 {
                font-size: 60px;
                letter-spacing: 4px;
            }

            .server {
                width: 100%;
                max-width: 330px;
            }

            .ip {
                flex: 1;
                font-size: 13px;
            }

            .features-grid {
                grid-template-columns: 1fr;
            }

            .feature {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .feature:last-child {
                border-bottom: none;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">WILDARCH</div>
        <a href="#servidor">Servidor</a>
    </nav>


    <main>

        <section class="hero">

            <div class="block block1"></div>
            <div class="block block2"></div>
            <div class="block block3"></div>
            <div class="block block4"></div>

            <div class="hero-content">

                <div class="tag">
                    Minecraft Survival
                </div>

                <h1>WILDARCH</h1>

                <p class="subtitle">
                    Un mundo. Tu aventura.
                </p>

                <div class="server">

                    <!-- CAMBIA LA IP -->
                    <span class="ip" id="ip">
                        play.wildarch.es
                    </span>

                    <button onclick="copyIP()">
                        COPIAR
                    </button>

                </div>

                <!-- CAMBIA EL DISCORD -->
                <br>

                <a
                    class="discord"
                    href="https://discord.gg/TU-SERVIDOR"
                    target="_blank"
                >
                    Discord →
                </a>

            </div>

        </section>


        <section class="features" id="servidor">

            <div class="features-grid">

                <div class="feature">
                    <h3>SURVIVAL</h3>
                    <p>
                        Sobrevive y construye tu propio mundo.
                    </p>
                </div>

                <div class="feature">
                    <h3>COMUNIDAD</h3>
                    <p>
                        Juega y crea junto a otros jugadores.
                    </p>
                </div>

                <div class="feature">
                    <h3>WILD</h3>
                    <p>
                        Explora un mundo lleno de posibilidades.
                    </p>
                </div>

            </div>

        </section>

    </main>


    <footer>
        © 2026 WILDARCH
    </footer>


    <script>

        function copyIP() {

            const ip = document.getElementById("ip").innerText;

            navigator.clipboard.writeText(ip);

            const button = document.querySelector("button");

            button.innerText = "¡COPIADO!";

            setTimeout(() => {
                button.innerText = "COPIAR";
            }, 1500);
        }

    </script>

</body>
</html>
```
